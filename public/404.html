<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | FurtherNorth</title>
    <style>
      body {
        margin: 0;
        background-color: #F1F0EB;
        color: #0E1116;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        max-width: 480px;
      }
      h1 {
        font-size: 32px;
        margin: 0 0 16px;
        font-weight: 700;
      }
      p {
        font-size: 16px;
        color: #5A6170;
        margin: 0 0 24px;
      }
      a {
        display: inline-block;
        background-color: #0E1116;
        color: #F1F0EB;
        padding: 12px 28px;
        border-radius: 9999px;
        text-decoration: none;
        font-weight: 500;
        font-size: 15px;
        transition: opacity 150ms ease;
      }
      a:hover {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Page not found</h1>
      <p>The page you requested could not be found.</p>
      <a href="/">Back to home</a>
    </div>
  </body>
</html>
